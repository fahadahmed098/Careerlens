<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="A shield protecting your data"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7867FF"/><stop offset="1" stop-color="#20D6C2"/></linearGradient><linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#20D6C2" stop-opacity="0"/><stop offset="1" stop-color="#20D6C2" stop-opacity=".5"/></linearGradient></defs><rect width="480" height="360" rx="24" fill="#101626"/><circle cx="410" cy="50" r="120" fill="#7867FF" opacity=".14"/><circle cx="50" cy="330" r="110" fill="#20D6C2" opacity=".10"/>
<circle cx="240" cy="180" r="120" fill="none" stroke="#7867FF" stroke-opacity=".4" stroke-width="2"><animate attributeName="r" values="100;150;100" dur="4s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values=".5;0;.5" dur="4s" repeatCount="indefinite"/></circle>
<circle cx="240" cy="180" r="100" fill="none" stroke="#20D6C2" stroke-opacity=".4" stroke-width="2"><animate attributeName="r" values="90;130;90" dur="4s" begin="1.3s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values=".5;0;.5" dur="4s" begin="1.3s" repeatCount="indefinite"/></circle>
<path d="M240 70l86 32v70c0 62-38 98-86 116-48-18-86-54-86-116v-70z" fill="#151E30" stroke="url(#g)" stroke-width="4"/>
<path d="M200 182l30 30 52-60" fill="none" stroke="#22C55E" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"><animate attributeName="stroke-dasharray" values="0 200;200 0" dur="1.4s" fill="freeze"/></path>
<g><rect x="46" y="70" width="100" height="30" rx="15" fill="#7867FF22" stroke="#7867FF77"/><text x="96" y="90" fill="#B9B0FF" font-family="Inter,Arial,sans-serif" font-weight="600" font-size="13" text-anchor="middle">No resume stored</text><animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="3s" repeatCount="indefinite"/></g>
